databases:
  - name: mimir-postgres
    plan: free

redis:
  - name: mimir-redis
    plan: free

services:
  - type: web
    name: mimir-web
    runtime: docker
    repo: https://github.com/parththirwani/Mimir.git
    dockerfilePath: ./apps/web/Dockerfile

  - type: web
    name: mimir-api
    runtime: docker
    repo: https://github.com/parththirwani/Mimir.git
    dockerfilePath: ./apps/api/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mimir-postgres
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: mimir-redis
          property: connectionString

  - type: worker
    name: mimir-worker
    runtime: docker
    repo: https://github.com/parththirwani/Mimir.git
    dockerfilePath: ./apps/worker/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mimir-postgres
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: mimir-redis
          property: connectionString
